id: ddr-scoreboard
name: DDR Scoreboard
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5180
      - http://127.0.0.1:5180
      - https://hale-basin-ac349ac472-swedencentral.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: public
  storage:
    enabled: false
  functions:
    enabled: true
    buildCommand: npm run build
    auth:
      type: application
