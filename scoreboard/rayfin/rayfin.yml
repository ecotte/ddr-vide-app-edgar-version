id: ddr-scoreboard
name: DDR Scoreboard
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://great-grass-4d2de2f7b4-westcentralus.webapp.msit.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: public
  storage:
    enabled: false
  functions:
    enabled: false
