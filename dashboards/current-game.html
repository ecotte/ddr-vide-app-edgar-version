<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Current game analytics</title>
  <style>
    :root { color-scheme: light dark; font-family: var(--vb-font-family, "Segoe UI", sans-serif); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; color: var(--vb-text-primary, #172033); background: transparent; }
    h2 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 6px 0; }
    .note, #context { color: var(--vb-text-secondary, #657089); font-size: 12px; }
    #status { padding: 18px 0; }
    .pad { display: grid; grid-template: repeat(3, minmax(70px, 1fr)) / repeat(3, 1fr); gap: 8px; max-width: 430px; margin: 16px auto; }
    .cell { min-height: 76px; padding: 8px; border: 2px solid #667085; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .cell strong { font-size: 22px; }
    .cell small { font-size: 11px; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; margin: 12px 0; }
    .key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
    .bar { display: flex; height: 34px; border-radius: 6px; overflow: hidden; background: var(--vb-border, #d0d5dd); margin: 8px 0; }
    .segment { display: flex; align-items: center; justify-content: center; color: #101828; font-size: 12px; font-weight: 700; min-width: 0; overflow: hidden; }
    .player { margin: 18px 0; }
    .stats { display: flex; gap: 24px; flex-wrap: wrap; margin: 10px 0; }
    .stat strong { font-size: 24px; }
    svg { display: block; width: 100%; height: auto; max-height: 330px; overflow: visible; }
    svg text { fill: var(--vb-text-secondary, #657089); font: 12px "Segoe UI", sans-serif; }
    .chart { margin-top: 12px; }
    .summary { font-size: 12px; }
    @media (max-width: 420px) { body { padding: 8px; } .cell { padding: 4px; } .cell strong { font-size: 18px; } }
  </style>
</head>
<body data-kind="__KIND__" data-player="__PLAYER__">
  <div id="context"></div>
  <div id="status" role="status">Waiting for current-game data...</div>
  <main id="visual" aria-live="polite"></main>
  <script>
    'use strict';
    const LANES = [
      ['Up-Left', '\u2196', 1, 1], ['Up-Right', '\u2197', 1, 3],
      ['Center', '\u25a3', 2, 2], ['Down-Left', '\u2199', 3, 1],
      ['Down-Right', '\u2198', 3, 3]
    ];
    const PLAYERS = ['P1', 'P2'];
    const COLORS = { P1: '#22b8cf', P2: '#f783ac' };
    const TIERS = [
      ['perfect', 'Perfect', '#63e6be'], ['great', 'Great', '#74c0fc'],
      ['good', 'Good', '#ffe066'], ['bad', 'Bad', '#ffc078'], ['miss', 'Miss', '#ffa8a8'],
      ['ungraded', 'Ungraded', '#ced4da']
    ];
    const root = document.getElementById('visual');
    const status = document.getElementById('status');
    function el(tag, text, parent, className) {
      const node = document.createElement(tag);
      if (text != null) node.textContent = text;
      if (className) node.className = className;
      if (parent) parent.appendChild(node);
      return node;
    }
    function svgEl(tag, attrs, parent, text) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (text != null) node.textContent = text;
      parent.appendChild(node);
      return node;
    }
    function legend(items, parent) {
      const row = el('div', null, parent, 'legend');
      items.forEach(([label, color]) => {
        const item = el('span', null, row);
        el('span', null, item, 'key').style.background = color;
        item.appendChild(document.createTextNode(label));
      });
    }
    function readRows(payload) {
      const tables = payload && payload.tables;
      const table = tables && Object.values(tables)[0];
      if (!table) throw new Error('Dashboard did not supply a result table.');
      const columns = table.columns || table.Columns;
      const rows = table.rows || table.Rows;
      if (!Array.isArray(columns) || !Array.isArray(rows)) throw new Error('Invalid result table.');
      const names = columns.map(c => typeof c === 'string' ? c : c.ColumnName || c.name);
      for (const required of ['Player', 'Outcome', 'Judgment', 'Directions', 'Seconds', 'Sequence', 'EventId', 'GameId', 'DurationSeconds']) {
        if (!names.includes(required)) throw new Error('Missing column: ' + required);
      }
      return rows.map(row => Object.fromEntries(names.map((name, i) => [name, row[i]])));
    }
    function normalize(rows) {
      const seen = new Set();
      return rows.filter(row => PLAYERS.includes(row.Player)).filter(row => {
        if (!row.EventId || !['hit', 'miss'].includes(row.Outcome)) throw new Error('Invalid judgment outcome.');
        if (seen.has(row.EventId)) return false;
        seen.add(row.EventId);
        return true;
      }).map(row => {
        const directions = typeof row.Directions === 'string' ? JSON.parse(row.Directions) : row.Directions;
        if (!Array.isArray(directions)) throw new Error('Invalid judgment directions.');
        return { ...row, Directions: [...new Set(directions.filter(d => LANES.some(l => l[0] === d)))] };
      });
    }
    function heatmap(rows, player) {
      el('h2', player + ' dance pad', root);
      el('p', 'Recognized hits / (hits + misses), by pad position', root, 'note');
      const pad = el('div', null, root, 'pad');
      LANES.forEach(([direction, symbol, row, column]) => {
        const attempts = rows.filter(r => r.Player === player && r.Directions.includes(direction));
        const hits = attempts.filter(r => r.Outcome === 'hit').length;
        const percentage = attempts.length ? hits / attempts.length * 100 : null;
        const cell = el('div', null, pad, 'cell');
        cell.style.gridRow = row;
        cell.style.gridColumn = column;
        el('span', symbol + ' ' + direction, cell);
        el('strong', percentage == null ? 'No data' : Math.round(percentage) + '%', cell);
        el('small', attempts.length ? hits + ' hits / ' + (attempts.length - hits) + ' misses' : 'No observed outcomes', cell);
        if (percentage != null) {
          cell.style.background = 'hsl(' + (percentage * 1.2) + ' 65% 78%)';
          cell.style.color = '#172033';
        }
      });
      legend([['0% hits', '#ebaaaa'], ['50%', '#ebebaa'], ['100% hits', '#aaebaa'], ['No data: unfilled', '#98a2b3']], root);
      const unknown = rows.filter(r => r.Player === player && !r.Directions.length).length;
      el('p', unknown + ' judgments with unknown direction excluded. Only taught/recognized misses can count.', root, 'note');
    }
    function judgments(rows) {
      legend(TIERS.map(([, label, color]) => [label, color]), root);
      PLAYERS.forEach(player => {
        const group = el('section', null, root, 'player');
        const selected = rows.filter(r => r.Player === player);
        el('h2', player + ' \u00b7 ' + selected.length + ' judgments', group);
        if (!selected.length) { el('p', 'No observed judgments', group); return; }
        const counts = Object.fromEntries(TIERS.map(([key]) => [key, 0]));
        selected.forEach(r => {
          const tier = r.Outcome === 'miss' ? 'miss' : TIERS.some(([key]) => key === r.Judgment) ? r.Judgment : 'ungraded';
          counts[tier]++;
        });
        const bar = el('div', null, group, 'bar');
        const details = [];
        TIERS.forEach(([key, label, color]) => {
          const count = counts[key];
          if (!count) return;
          const percent = count / selected.length * 100;
          const segment = el('div', percent >= 9 ? Math.round(percent) + '%' : '', bar, 'segment');
          segment.style.width = percent + '%';
          segment.style.background = color;
          segment.title = label + ': ' + count + ' (' + percent.toFixed(1) + '%)';
          details.push(segment.title);
        });
        el('p', details.join(' \u00b7 '), group, 'summary');
      });
      el('p', 'One count per recognized judgment, including simultaneous arrows. Unknown tiers stay Ungraded.', root, 'note');
    }
    function streaks(rows) {
      const series = {};
      PLAYERS.forEach(player => {
        const selected = rows.filter(r => r.Player === player);
        const completeTiming = selected.every(r => Number.isFinite(r.Seconds));
        selected.sort((a, b) => (completeTiming ? a.Seconds - b.Seconds : 0) || a.Sequence - b.Sequence || a.EventId.localeCompare(b.EventId));
        let current = 0, best = 0;
        series[player] = selected.map((r, i) => {
          current = r.Outcome === 'miss' ? 0 : r.Judgment === 'bad' ? current : current + 1;
          best = Math.max(best, current);
          return { x: i + 1, y: current, miss: r.Outcome === 'miss' };
        });
        const stat = el('div', null, root, 'stat');
        el('strong', player + ': ' + (selected.length ? current : 'No data'), stat);
        el('span', selected.length ? ' current \u00b7 ' + best + ' best' : '', stat);
      });
      plot(series, 'Judgment number (each player)', 'Consecutive successful judgments', true);
      el('p', 'Misses reset the streak (red dots). BAD is a hit but leaves the streak unchanged. Other successful multi-arrow judgments extend it once. Ordered by video time, then sequence; sequence is used if timing is missing.', root, 'note');
    }
    function momentum(rows, duration) {
      const timed = rows.filter(r => Number.isFinite(r.Seconds) && r.Seconds >= 0);
      const excluded = rows.length - timed.length;
      if (!timed.length) {
        el('p', 'No timed judgments available for momentum.', root);
        return;
      }
      const last = Math.max(Number.isFinite(duration) ? duration : 0, ...timed.map(r => r.Seconds));
      const buckets = Math.floor(last / 5) + 1;
      const series = {};
      PLAYERS.forEach(player => {
        const selected = timed.filter(r => r.Player === player);
        if (!selected.length) { series[player] = []; return; }
        const counts = Array(buckets).fill(0);
        selected.filter(r => r.Outcome === 'hit').forEach(r => counts[Math.floor(r.Seconds / 5)]++);
        series[player] = counts.map((y, i) => ({ x: i * 5, y }));
      });
      plot(series, 'Seconds since game start (5-second bins)', 'Successful judgments / 5 seconds', false);
      el('p', 'Final bin may be incomplete. Missing player data is not drawn as zero.' + (excluded ? ' ' + excluded + ' untimed judgments excluded.' : ''), root, 'note');
    }
    function plot(series, xTitle, yTitle, stepped) {
      const all = Object.values(series).flat();
      if (!all.length) return;
      const w = 900, h = 280, left = 60, right = 18, top = 14, bottom = 52;
      const maxX = Math.max(1, ...all.map(p => p.x));
      const maxY = Math.max(1, ...all.map(p => p.y));
      const x = value => left + value / maxX * (w - left - right);
      const y = value => h - bottom - value / maxY * (h - top - bottom);
      const chart = el('div', null, root, 'chart');
      const svg = svgEl('svg', { viewBox: '0 0 ' + w + ' ' + h, role: 'img', 'aria-label': yTitle + ' by ' + xTitle }, chart);
      svgEl('title', {}, svg, yTitle + ' by ' + xTitle);
      for (let i = 0; i <= 4; i++) {
        const value = maxY * i / 4;
        svgEl('line', { x1: left, y1: y(value), x2: w - right, y2: y(value), stroke: 'var(--vb-border, #98a2b3)', opacity: '.4' }, svg);
        svgEl('text', { x: left - 8, y: y(value) + 4, 'text-anchor': 'end' }, svg, value.toFixed(value % 1 ? 1 : 0));
        const time = maxX * i / 4;
        svgEl('text', { x: x(time), y: h - bottom + 20, 'text-anchor': 'middle' }, svg, time.toFixed(time % 1 ? 1 : 0));
      }
      svgEl('text', { x: w / 2, y: h - 4, 'text-anchor': 'middle' }, svg, xTitle);
      PLAYERS.forEach(player => {
        const points = series[player];
        if (!points.length) return;
        let path = 'M ' + x(points[0].x) + ' ' + y(points[0].y);
        points.slice(1).forEach(p => { path += stepped ? ' H ' + x(p.x) + ' V ' + y(p.y) : ' L ' + x(p.x) + ' ' + y(p.y); });
        svgEl('path', { d: path, fill: 'none', stroke: COLORS[player], 'stroke-width': 3 }, svg);
        points.filter(p => p.miss || points.length === 1).forEach(p => {
          const dot = svgEl('circle', { cx: x(p.x), cy: y(p.y), r: p.miss ? 4 : 3, fill: p.miss ? '#e03131' : COLORS[player] }, svg);
          svgEl('title', {}, dot, player + (p.miss ? ' Miss' : '') + ': ' + p.y + ' at ' + p.x);
        });
      });
      legend(PLAYERS.map(p => [p + (series[p].length ? '' : ' (no data)'), COLORS[p]]), root);
      el('p', yTitle, root, 'note');
    }
    function render(raw) {
      root.replaceChildren();
      const rows = normalize(raw);
      const game = raw.find(r => r.GameId);
      document.getElementById('context').textContent = game ? 'Current game \u00b7 ' + game.GameId : 'No gameplay observed in the last 24 hours';
      status.textContent = !rows.length ? 'Waiting for recognized judgments in the current game.' : '';
      const kind = document.body.dataset.kind;
      if (kind === 'heatmap') heatmap(rows, document.body.dataset.player);
      else if (kind === 'judgments') judgments(rows);
      else if (kind === 'momentum') momentum(rows, game && game.DurationSeconds);
      else if (kind === 'streaks') streaks(rows);
      else throw new Error('Unknown visual kind.');
    }
    window.addEventListener('message', event => {
      if (event.source !== window.parent || !event.data || event.data.type !== 'RTD_VISUAL_BUILDER_DATA') return;
      try {
        render(readRows(event.data.payload));
      } catch (error) {
        console.error('Current-game visual failed', error);
        root.replaceChildren();
        status.textContent = 'Unable to display current-game visual: ' + error.message;
      }
    });
    window.parent.postMessage({ type: 'RTD_VISUAL_BUILDER_READY' }, '*');
  </script>
</body>
</html>
